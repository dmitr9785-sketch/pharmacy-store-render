services:
  - type: web
    name: pharmacy-store
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 24

databases:
  - name: pharmacy-db
    databaseName: pharmacy_store
    plan: free
